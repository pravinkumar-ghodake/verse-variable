
# ============================================================
# VERSE & VARIABLE
# Multilingual Literary Registry
# ============================================================
#
# This file defines the original languages represented in
# the literary archive and their typographic requirements.
#
# Website interface and editorial writing: English.
# Original literary expressions: Original language and script.
#
# Encoding: UTF-8
# ============================================================

version: 1

# ------------------------------------------------------------
# 1. EDITORIAL LANGUAGE
# ------------------------------------------------------------

editorial_language:

  name: "English"
  code: "en"
  script: "Latin"
  script_code: "Latn"
  direction: "ltr"

  font:
    family: "Literata"
    css_stack: '"Literata", Georgia, serif'

  purpose:
    - "Website interface"
    - "Article titles"
    - "English translations"
    - "Personal reflections"
    - "Editorial descriptions"
    - "Source references"

# ------------------------------------------------------------
# 2. ORIGINAL LITERARY LANGUAGES
# ------------------------------------------------------------

languages:

  # ==========================================================
  # HINDI
  # ==========================================================

  - id: "hindi"

    name: "Hindi"
    native_name: "हिन्दी"

    code: "hi"
    script: "Devanagari"
    script_code: "Deva"

    direction: "ltr"

    typography:
      font_family: "Noto Serif Devanagari"
      css_stack: '"Noto Serif Devanagari", "Noto Serif", serif'
      style: "serif"
      text_align: "left"
      line_height: 1.9
      letter_spacing: "normal"

    transliteration:
      supported: true
      recommended: false
      format: "IAST or readable Roman transliteration"

    editorial_scope:
      - "Shayari"
      - "Doha"
      - "Poetry"
      - "Ghazal"
      - "Classical literature"
      - "Modern Hindi writing"
      - "Philosophical expressions"

    display:
      label: "Original text · Hindi"
      show_native_name: true
      preserve_original_script: true
      english_translation: true

  # ==========================================================
  # URDU
  # ==========================================================

  - id: "urdu"

    name: "Urdu"
    native_name: "اردو"

    code: "ur"
    script: "Arabic (Nastaliq)"
    script_code: "Arab"

    direction: "rtl"

    typography:
      font_family: "Noto Nastaliq Urdu"
      css_stack: '"Noto Nastaliq Urdu", "Noto Naskh Arabic", serif'
      style: "nastaliq"
      text_align: "right"
      line_height: 2.5
      letter_spacing: "normal"

    transliteration:
      supported: true
      recommended: true
      format: "Roman Urdu"

    editorial_scope:
      - "Sher"
      - "Shayari"
      - "Ghazal"
      - "Nazm"
      - "Rubai"
      - "Qawwali poetry"
      - "Philosophical poetry"
      - "Literary expressions"

    display:
      label: "Original text · Urdu"
      show_native_name: true
      preserve_original_script: true
      english_translation: true
      right_to_left: true

  # ==========================================================
  # MARATHI
  # ==========================================================

  - id: "marathi"

    name: "Marathi"
    native_name: "मराठी"

    code: "mr"
    script: "Devanagari"
    script_code: "Deva"

    direction: "ltr"

    typography:
      font_family: "Noto Serif Devanagari"
      css_stack: '"Noto Serif Devanagari", "Noto Serif", serif'
      style: "serif"
      text_align: "left"
      line_height: 1.9
      letter_spacing: "normal"

    transliteration:
      supported: true
      recommended: false
      format: "IAST or readable Roman transliteration"

    editorial_scope:
      - "Kavita"
      - "Abhang"
      - "Bhakti poetry"
      - "Modern Marathi poetry"
      - "Philosophical literature"
      - "Lyrical compositions"

    display:
      label: "Original text · Marathi"
      show_native_name: true
      preserve_original_script: true
      english_translation: true

  # ==========================================================
  # KANNADA
  # ==========================================================

  - id: "kannada"

    name: "Kannada"
    native_name: "ಕನ್ನಡ"

    code: "kn"
    script: "Kannada"
    script_code: "Knda"

    direction: "ltr"

    typography:
      font_family: "Noto Serif Kannada"
      css_stack: '"Noto Serif Kannada", serif'
      style: "serif"
      text_align: "left"
      line_height: 2.0
      letter_spacing: "normal"

    transliteration:
      supported: true
      recommended: false
      format: "Readable Roman transliteration"

    editorial_scope:
      - "Vachana"
      - "Classical poetry"
      - "Modern Kannada poetry"
      - "Philosophical expressions"
      - "Literary passages"
      - "Song lyrics"

    display:
      label: "Original text · Kannada"
      show_native_name: true
      preserve_original_script: true
      english_translation: true

  # ==========================================================
  # TAMIL
  # ==========================================================

  - id: "tamil"

    name: "Tamil"
    native_name: "தமிழ்"

    code: "ta"
    script: "Tamil"
