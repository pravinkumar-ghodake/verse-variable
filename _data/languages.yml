# ------------------------------------------------------------
# 3. SHARED LITERARY PRESENTATION RULES
# ------------------------------------------------------------

literary_presentation:

  preserve_original_text: true

  preserve_original_punctuation: true

  preserve_line_breaks: true

  preserve_poetic_stanza_structure: true

  translation_language: "English"

  translation_style: "Literary and meaning-preserving"

  transliteration:
    optional: true
    independently_verified: true

  attribution:
    author_required_when_known: true
    original_work_required_when_identifiable: true
    uncertain_attribution_must_be_disclosed: true

  formatting:
    original_text_precedes_translation: true
    language_label_in_english: true
    translation_visually_distinct: true

# ------------------------------------------------------------
# 4. SCRIPT AND TYPOGRAPHY NOTES
# ------------------------------------------------------------

typography_notes:

  urdu:
    description: >-
      Urdu literary expressions should use Nastaliq typography.
      Text direction must be right-to-left. Preserve appropriate
      line alignment, spacing and poetic composition.

  devanagari:
    languages:
      - "Hindi"
      - "Marathi"
    description: >-
      Hindi and Marathi share the Devanagari script but remain
      independently identified by their language metadata.

  regional_scripts:
    description: >-
      Kannada, Tamil, Malayalam and Telugu must retain their
      own native scripts and appropriate typefaces.

  english:
    description: >-
      English remains the exclusive language of the website
      interface, editorial titles, translations and reflections.

# ------------------------------------------------------------
# END OF MULTILINGUAL REGISTRY
# ============================================================
