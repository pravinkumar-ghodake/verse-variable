
name: Build and deploy Jekyll site to GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build Jekyll website
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

        
      
      - name: Inspect homepage source bytes
        shell: bash
        run: |
          echo "===== SOURCE FILE: FIRST 8 LINES ====="
          sed -n '1,8l' index.html

          echo "===== SOURCE FILE: FIRST 32 BYTES ====="
          od -An -tx1 -N 32 index.html

          echo "===== GENERATED FILE: FIRST 8 LINES ====="
          sed -n '1,8l' ./_site/index.html

          echo "===== GENERATED FILE: FIRST 32 BYTES ====="
          od -An -tx1 -N 32 ./_site/index.html

      
      
      - name: Diagnose generated homepage
        shell: bash
        run: |
          echo "======================================"
          echo "GENERATED WEBSITE FILES"
          echo "======================================"

          find ./_site -maxdepth 2 -type f | sort | head -60

          echo "======================================"
          echo "GENERATED INDEX.HTML - FIRST 50 LINES"
          echo "======================================"

          if [ -f ./_site/index.html ]; then
            sed -n '1,50p' ./_site/index.html
          else
            echo "ERROR: _site/index.html was not generated"
          fi

          echo "======================================"
          echo "FRONT MATTER CHECK"
          echo "======================================"

          if [ -f ./_site/index.html ]; then
            if head -n 5 ./_site/index.html | grep -q '^---$'; then
              echo "WARNING: YAML front matter remains in generated HTML"
            else
              echo "PASS: No YAML front matter at the beginning"
            fi
          fi


      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    needs: build

    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
